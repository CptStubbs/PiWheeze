services:
  sensor_data:
    build: .
    environment:
      TZ: America/Los_Angeles
    devices:
      - /dev/i2c-1:/dev/i2c-1
    group_add:
      - "988"   # host i2c GID on Raspberry Pi OS Trixie
    volumes:
      - data-storage:/data_storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  dashboard:
    build: .
    volumes:
      - data-storage:/data_storage:ro
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    expose:
      - "8501"
    environment:
      TZ: America/Los_Angeles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/.streamlit
    restart: unless-stopped
  homekit:
    build: .
    volumes:
      - data-storage:/data_storage:ro
      - homekit-state:/homekit_state
    command: python -m homekit.run
    network_mode: host
    environment:
      TZ: America/Los_Angeles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - "8501:8501"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DASHBOARD_BASIC_AUTH_HASH: ${DASHBOARD_BASIC_AUTH_HASH}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

volumes:
  data-storage:
  homekit-state:
  caddy-data:
  caddy-config:
